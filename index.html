<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise 🖤</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #080808;
  color: #f5d58a;
  font-family: Georgia, serif;
  text-align: center;
  overflow-x: hidden;
}

.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(#f5d58a 1px, transparent 1px),
    radial-gradient(#ffffff 1px, transparent 1px);
  background-size: 70px 70px, 110px 110px;
  background-position: 0 0, 35px 45px;
  opacity: 0.35;
}

main {
  position: relative;
  max-width: 600px;
  margin: auto;
  padding: 90px 22px 60px;
}

.crown {
  font-size: 48px;
  animation: float 2s ease-in-out infinite;
}

h1 {
  font-size: clamp(35px, 8vw, 55px);
  margin: 20px 0;
}

.gold {
  color: #ffffff;
}

.subtitle {
  font-size: 19px;
  line-height: 1.8;
  color: #d0c5b0;
}

button {
  margin-top: 25px;
  padding: 15px 25px;
  background: #f5d58a;
  color: #111;
  border: none;
  border-radius: 30px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: white;
  transform: scale(1.04);
}

#letter {
  display: none;
  margin-top: 35px;
  padding: 25px;
  background: #171512;
  border: 1px solid #b99a56;
  border-radius: 18px;
  color: #fff2d0;
  line-height: 1.9;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  animation: appear 1s ease;
}

footer {
  margin-top: 45px;
  color: #b7a783;
  font-size: 14px;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

@keyframes appear {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>
<div class="stars"></div>

<main>
  <div class="crown">👑</div>

  <p>✦ A LITTLE BIRTHDAY SURPRISE ✦</p>

  <h1>Happy Birthday,<br>
  <span class="gold">Brooo! 🖤</span></h1>

  <p class="subtitle">
    Another year of you being donkey. 🫏😂<br>
    And somehow, you're still special!
  </p>

  <p style="font-size:45px">🎂 🖤 ✨</p>

  <p class="subtitle">
    Your birthday comes with one tiny rule:<br>
    You must open your surprise!
  </p>

  <button onclick="openLetter()">
    Open Your Surprise 💌
  </button>

  <div id="letter"></div>

  <footer>
    Made with 🖤, friendship & a little madness.
  </footer>
</main>

<script>
function openLetter() {
  const letter = document.getElementById("letter");

  if (letter.style.display === "block") {
    letter.style.display = "none";
    return;
  }

  letter.textContent =
    "💌 YOUR LETTER GOES HERE 💌\n\n" +
    "Your personal birthday letter will appear here. 🖤\n\n" +
    "We'll replace this with your own words!";
    
  letter.style.display = "block";
}
</script>

</body>
</html>
